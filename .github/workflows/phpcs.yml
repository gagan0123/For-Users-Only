name: PHPCS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: cs2pr, phpcs

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require dealerdirect/phpcodesniffer-composer-installer:"^1.0" wp-coding-standards/wpcs:"^3.0" --no-interaction

      - name: Run PHPCS
        run: phpcs --report=checkstyle | cs2pr
